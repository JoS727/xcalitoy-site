<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your download — CALITOY</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Every Calitoy work in one place: music, digital downloads, vinyl, books, graphic novels, TV and merch — with the best place to buy each.">
  <meta name="theme-color" content="#080912">
  <link rel="icon" type="image/svg+xml" href="https://calitoy-agency.abacusai.app/favicon.svg">
  <link rel="canonical" href="https://calitoy.com/works/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://calitoy.com/works/">
  <meta property="og:title" content="The Works — CALITOY">
  <meta property="og:image" content="https://calitoy.com/works/img/xcalitoy.jpg">
  <style>
    :root {
      --ink: hsl(235, 42%, 5%); --panel: rgba(255,255,255,0.045); --line: rgba(255,255,255,0.09);
      --violet: hsl(264, 100%, 72%); --gold: hsl(41, 65%, 54%); --orange: #ff8a2a;
      --display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --gutter: clamp(1.1rem, 4vw, 2.5rem); --maxw: 1320px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { font-family: var(--body); background: var(--ink); color: #fff; min-height: 100vh; overflow-x: hidden; line-height: 1.5; }
    a { color: inherit; }
    .aurora { position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(52% 42% at 22% 6%, rgba(122,74,255,0.14), transparent 70%), radial-gradient(46% 38% at 82% 96%, rgba(214,166,59,0.09), transparent 72%); }
    .wrap { position: relative; z-index: 1; max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
    .nav { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(8,9,18,0.72); max-width: 100vw; overflow-x: clip; }
    .nav-inner { max-width: var(--maxw); margin: 0 auto; padding: 0.8rem var(--gutter); display: flex; align-items: center; gap: 1rem; }
    .brand { text-decoration: none; color: #fff; font-family: var(--display); font-weight: 700; font-size: 0.98rem; letter-spacing: 0.16em; }
    .brand .c { color: var(--gold); }
    .identity-nav { margin-left: auto; display: flex; flex: 1; max-width: 720px; }
    .identity-nav a { flex: 1 1 0; text-align: center; text-decoration: none; white-space: nowrap; color: rgba(255,255,255,0.62); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.24em; padding: 0.55rem 0.4rem; border-left: 1px solid rgba(255,255,255,0.05); }
    .identity-nav a:first-child { border-left: 0; }
    .identity-nav a:hover { color: var(--gold); }
    @media (max-width: 900px) { .nav-inner { flex-wrap: wrap; } .identity-nav { max-width: none; width: 100%; order: 3; margin-left: 0; } }
    @media (max-width: 560px) { .identity-nav a { font-size: 0.56rem; letter-spacing: 0.12em; padding: 0.5rem 0.2rem; } }
    .site-menu-bar{position:sticky;top:0;z-index:900;background:rgba(8,9,18,0.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(216,182,106,0.18);}
    .site-menu-head{display:flex;align-items:center;gap:.6rem;max-width:1200px;margin:0 auto;padding:.32rem .9rem;}
    .menu-label{font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(228,196,116,.75);}
    .site-menu{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
    .site-menu::-webkit-scrollbar{display:none;}
    .site-menu a{flex:none;color:rgba(255,255,255,.72);text-decoration:none;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;padding:.42rem .7rem;white-space:nowrap;border-left:1px solid rgba(216,182,106,.12);}
    .site-menu a:first-child{border-left:0;}
    .site-menu a.active{color:#ff8a2a;box-shadow:inset 0 -2px 0 #ff8a2a;}
    @media (max-width:640px){.menu-label{display:none;}}

    .hero { display: grid; grid-template-columns: minmax(0, 420px) 1fr; gap: clamp(1.2rem, 4vw, 3rem); align-items: center; padding: clamp(1.6rem, 5vw, 3.6rem) 0 1.2rem; }
    .hero-cover { width: 100%; height: auto; aspect-ratio: 1; border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(216,182,106,0.12); }
    .eyebrow { color: var(--gold); letter-spacing: 0.36em; font-size: 0.66rem; text-transform: uppercase; }
    h1 { font-family: var(--display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; font-size: clamp(2.6rem, 9vw, 5rem); margin: 0.4rem 0 0.6rem; }
    .lede { color: rgba(255,255,255,0.66); max-width: 52ch; font-size: 0.98rem; }
    .hero .buy { margin-top: 1.1rem; }
    .hero-links { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }
    .ghost { font-size: 0.78rem; text-decoration: none; padding: 0.5rem 0.8rem; border: 1px solid var(--line); border-radius: 999px; color: rgba(255,255,255,0.82); }
    .ghost:hover { border-color: var(--gold); color: var(--gold); }
    .jump { display: inline-block; margin-top: 1rem; font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--violet); text-decoration: none; }
    @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .hero-cover { max-width: 340px; margin: 0 auto; } .hero-copy { text-align: left; } }

    .jumpbar { display: flex; gap: 0.4rem; overflow-x: auto; scrollbar-width: none; padding: 0.6rem 0 0.2rem; }
    .jumpbar::-webkit-scrollbar { display: none; }
    .jumpbar a { flex: none; font-size: 0.7rem; text-decoration: none; padding: 0.42rem 0.75rem; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: rgba(255,255,255,0.8); }
    .sec { padding-top: 2.4rem; scroll-margin-top: 4rem; }
    .row-title { font-family: var(--display); color: rgba(255,255,255,0.88); font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; display: flex; gap: 0.6rem; align-items: center; margin-bottom: 0.5rem; }
    .row-title .n { color: var(--gold); font-weight: 700; }
    .row-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .sec-lede { color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 1rem; }
    .sub { font-family: var(--display); font-size: 1rem; margin: 1.2rem 0 0.7rem; color: rgba(255,255,255,0.8); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 0.9rem; }
    .item { display: grid; grid-template-columns: 112px 1fr; gap: 0.9rem; padding: 0.9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; align-items: start; }
    .cover { width: 112px; height: 112px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); }
    .cover-blank { display: grid; place-items: center; font-family: var(--display); font-size: 2.4rem; color: var(--gold); background: linear-gradient(135deg, rgba(122,74,255,0.25), rgba(214,166,59,0.15)); }
    .item h3 { font-family: var(--display); font-size: 1.05rem; line-height: 1.2; }
    .meta { color: rgba(255,255,255,0.5); font-size: 0.76rem; display: block; }
    .item.soon { opacity: 0.85; }
    .badge { display: inline-block; font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); border: 1px solid rgba(216,182,106,0.4); border-radius: 999px; padding: 0.15rem 0.55rem; margin-bottom: 0.35rem; }
    .nfs { font-size: 0.78rem; color: rgba(255,255,255,0.6); margin-top: 0.4rem; }
    .single-note { font-size: 0.74rem; color: rgba(255,255,255,0.55); margin-top: 0.3rem; }
    .wtb { margin-top: 0.6rem; }
    .wtb-h { font-size: 0.6rem; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(255,255,255,0.45); }
    .wtb ol { list-style: none; margin-top: 0.35rem; display: grid; gap: 0.32rem; }
    .wtb li { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.82rem; }
    .wtb li a { text-decoration: none; color: rgba(255,255,255,0.86); border-bottom: 1px solid rgba(255,255,255,0.15); }
    .wtb li a:hover { color: var(--gold); border-color: var(--gold); }
    .tier { flex: none; width: 1.25rem; height: 1.25rem; border-radius: 50%; display: grid; place-items: center; font-size: 0.62rem; font-weight: 700; background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.6); margin-top: 0.1rem; }
    .t1 .tier { background: var(--gold); color: #111; }
    .tag { font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-left: 0.2rem; }
    .buy { display: flex; flex-direction: column; gap: 0.2rem; }
    .buy-btn { font: 700 0.84rem var(--display); letter-spacing: 0.02em; padding: 0.7rem 1rem; min-height: 44px; border-radius: 12px; border: 0; cursor: pointer; background: linear-gradient(135deg, var(--gold), var(--orange)); color: #120c02; }
    .buy-btn:disabled { cursor: default; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); border: 1px dashed rgba(255,255,255,0.2); }
    .buy-note { font-size: 0.66rem; color: rgba(255,255,255,0.42); }
    .dl-list { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 0.8rem; }
    .dl { display: grid; grid-template-columns: 64px 1fr; gap: 0.8rem; padding: 0.8rem; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    .dl img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; }
    .dl strong { font-family: var(--display); display: block; }
    .dl .buy { margin-top: 0.45rem; }
    .cta { display: inline-block; margin-top: 0.6rem; margin-right: 0.5rem; font-size: 0.8rem; text-decoration: none; padding: 0.6rem 0.9rem; min-height: 44px; border-radius: 12px; border: 1px solid rgba(216,182,106,0.45); color: var(--gold); }
    .cta:hover { background: rgba(216,182,106,0.1); }
    .note-card { padding: 1.1rem; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); max-width: 760px; }
    .note-card h3 { font-family: var(--display); margin-bottom: 0.35rem; }
    .note-card p { font-size: 0.88rem; color: rgba(255,255,255,0.68); margin-bottom: 0.4rem; }
    .merch { display: grid; grid-template-columns: 180px 1fr; gap: 1rem; align-items: center; padding: 1rem; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
    .merch img { width: 100%; border-radius: 12px; }
    .merch h3 { font-family: var(--display); }
    .merch p { color: rgba(255,255,255,0.6); font-size: 0.88rem; }
    @media (max-width: 520px) { .merch { grid-template-columns: 1fr; } .merch img { max-height: 160px; object-fit: cover; } .item { grid-template-columns: 84px 1fr; } .cover { width: 84px; height: 84px; } }
    .flash { display: none; margin: 1rem 0 0; padding: 0.8rem 1rem; border-radius: 12px; border: 1px solid rgba(216,182,106,0.4); background: rgba(216,182,106,0.08); font-size: 0.86rem; }
    footer.site { margin-top: 3rem; padding: 1.4rem 0 2.2rem; border-top: 1px solid rgba(255,255,255,0.06); position: relative; z-index: 1; }
    footer.site .wrap { display: flex; flex-wrap: wrap; gap: 0.9rem; justify-content: space-between; color: rgba(255,255,255,0.4); font-size: 0.78rem; }
    footer.site a { color: rgba(255,255,255,0.6); text-decoration: none; }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="https://calitoy.com" aria-label="CALITOY"><span class="c">C</span>ALITOY</a>
      <nav class="identity-nav" aria-label="The five identities">
        <a href="https://calitoy.org">CREATIVE AGENCY</a>
        <a href="https://xcalitoy.com">SONGWRITER</a>
        <a href="https://josephcalitoy.com">CONSULTANT</a>
        <a href="https://author.calitoy.com">AUTHOR</a>
        <a href="https://art.calitoy.com">ARTIST</a>
      </nav>
    </div>
  </header>
  <div class="site-menu-bar"><div class="site-menu-head"><span class="menu-label">Menu</span><nav class="site-menu" aria-label="Site menu"><a href="/">Hub</a><a href="/works/" class="active">Works</a><a href="/casting/">Casting</a><a href="/content/">Content</a><a href="/customs/">Customs</a><a href="/merch/">Merch</a><a href="/stamp/">Stamp</a></nav></div></div>

  <main class="wrap">
    <section class="sec" style="max-width:640px;padding-top:3rem">
      <span class="eyebrow">Order</span>
      <h1 style="font-size:clamp(2rem,7vw,3rem)" id="h">Checking your payment…</h1>
      <p class="lede" id="msg">One moment — we're confirming your order with Stripe.</p>
      <p><a class="buy-btn" id="dl" style="display:none;text-decoration:none;margin-top:1.2rem" href="#">Download</a></p>
      <p class="meta" id="exp" style="margin-top:.8rem"></p>
      <p style="margin-top:1.6rem"><a class="cta" href="/works/">Back to the Works ›</a></p>
    </section>
  </main>
<script>
(function(){
  var sid = new URLSearchParams(location.search).get('session_id') || '';
  var h = document.getElementById('h'), m = document.getElementById('msg'), a = document.getElementById('dl'), x = document.getElementById('exp');
  fetch('/api/verify?session_id=' + encodeURIComponent(sid)).then(function(r){ return r.json(); }).then(function(d){
    if (d.status === 'paid') {
      h.textContent = 'Thank you — ' + d.title;
      m.textContent = 'Payment confirmed. Your ' + (d.format || 'download') + ' is ready.';
      a.href = d.download_url; a.textContent = 'Download ' + d.title; a.style.display = 'inline-block';
      x.textContent = 'This link expires in ' + Math.round(d.expires_in / 60) + ' minutes. Bookmark this page — reopening it gives you a fresh link.';
    } else {
      h.textContent = d.status === 'unpaid' ? 'Payment not completed' : 'We couldn\'t confirm that order';
      m.textContent = d.message || 'If you were charged, email books@calitoy.com with your Stripe receipt.';
    }
  }).catch(function(){ h.textContent = 'Something went wrong'; m.textContent = 'Please refresh this page. If you were charged, email books@calitoy.com with your receipt.'; });
})();
</script>
</body>
</html>
