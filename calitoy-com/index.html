<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALITOY — Joseph Calitoy</title>
  <meta name="description" content="The Calitoy ecosystem — creative, analytical, corporate, and personal properties united.">
  <link rel="icon" type="image/svg+xml" href="https://calitoy-agency.abacusai.app/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --ink: hsl(235, 35%, 6%);
      --violet: hsl(264, 100%, 72%);
      --gold: hsl(41, 65%, 54%);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--ink);
      color: #fff;
      overflow-x: hidden;
    }
    
    .hero-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ink);
    }
    
    .hero-image-wrapper {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
    }
    
    .hero-image {
      width: 100%;
      height: auto;
      display: block;
    }
    
    /* Interactive quadrant overlays */
    .quadrant-map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0;
    }
    
    .quadrant {
      position: relative;
      cursor: pointer;
      transition: all 0.3s ease;
      background: transparent;
    }
    
    .quadrant::before {
      content: '';
      position: absolute;
      inset: 0;
      background: transparent;
      transition: background 0.3s ease;
      pointer-events: none;
    }
    
    .quadrant:hover::before {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .quadrant.music:hover::before {
      background: rgba(169, 112, 255, 0.15);
    }
    
    .quadrant.core:hover::before {
      background: rgba(214, 166, 59, 0.15);
    }
    
    .quadrant.corp:hover::before {
      background: rgba(255, 255, 255, 0.08);
    }
    
    .quadrant.personal:hover::before {
      background: rgba(255, 255, 255, 0.08);
    }
    
    /* Footer */
    .footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      background: linear-gradient(to top, rgba(10, 11, 21, 0.9), transparent);
    }
    
    .footer a {
      color: var(--violet);
      text-decoration: none;
      transition: color 0.3s ease;
    }
    
    .footer a:hover {
      color: var(--gold);
    }
    
    @media (max-width: 768px) {
      .footer {
        font-size: 0.65rem;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  
  <div class="hero-container">
    <div class="hero-image-wrapper">
      <img 
        src="./hero.jpg" 
        alt="Joseph Calitoy - Calitoy Ecosystem"
        class="hero-image"
      >
      
      <!-- Interactive quadrant overlays -->
      <div class="quadrant-map">
        <a href="https://xcalitoy.com" class="quadrant music" aria-label="Calitoy Music"></a>
        <a href="https://calitoycore.com" class="quadrant core" aria-label="CalitoyCore"></a>
        <a href="https://calitoy-agency.abacusai.app" class="quadrant corp" aria-label="Calitoy Corp"></a>
        <a href="https://josephcalitoy.com" class="quadrant personal" aria-label="Joseph Calitoy"></a>
      </div>
    </div>
    
    <div class="footer">
      <p>A <a href="https://calitoy-agency.abacusai.app">Calitoy</a> Creative Property</p>
    </div>
  </div>
  
</body>
</html>
