<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calitoy Merch — moved</title>
  <!-- The store moved to the app at /#/merch. This page is kept as a
       redirect rather than deleted: it is still indexed and still linked
       from older posts, and a 404 loses those visitors entirely.

       canonical tells search engines which URL is the real one so the old
       path stops competing with the new store in results. -->
  <link rel="canonical" href="https://xcalitoy.com/#/merch">
  <meta http-equiv="refresh" content="0; url=https://xcalitoy.com/#/merch">
  <meta name="robots" content="noindex,follow">
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#0d0711;color:#f7eafb;font-family:'DM Mono',monospace;text-align:center;padding:24px}
    a{color:#ff6dbe}
  </style>
</head>
<body>
  <p>The store has moved.<br><a href="https://xcalitoy.com/#/merch">Continue to Calitoy Merch →</a></p>
  <script>location.replace("https://xcalitoy.com/#/merch");</script>
</body>
</html>
